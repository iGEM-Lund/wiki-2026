# Runs in iGEM's GitLab, against the mirror of this repo. iGEM does not
# accept pre-built HTML; this pipeline must run `npm ci && npm run build`
# itself. `npm run build` is the production/export path by default (see
# package.json + scripts/keystatic-routes.mjs): it strips Keystatic's admin
# routes before `next build` runs with BUILD_TARGET=production, output:'export'.
#
# iGEM's GitLab does pre-seed the repo with its own starter .gitlab-ci.yml
# (a Vite/yarn Pages template), confirmed by inspecting the template.
# scripts/deploy-production.sh's mirror push replaces the whole tree,
# this file included, so it fully overwrites theirs; no reconciling needed.
# One job: iGEM's GitLab rejects large artifact uploads (413), so the export is
# uploaded once, as `public`, rather than as a build artifact and again as the
# Pages artifact. The .woff/.ttf duplicates of every font are dropped; the
# .woff2 files listed first in each @font-face are used by all current browsers.
image: node:20-alpine

pages:
  script:
    - npm ci
    - npm run build
    - node scripts/verify-export.mjs
    - find out -type f \( -name '*.woff' -o -name '*.ttf' \) -delete
    - mv out public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
