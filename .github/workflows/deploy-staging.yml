name: Deploy staging

# Runs on the self-hosted runner living on the staging VPS itself, so
# checkout/build/restart all happen locally on the box that serves the site.
# Restricted to push on main (never pull_request) since a self-hosted runner
# executes workflow code with real permissions on that machine.
on:
  push:
    branches: [main]

# A burst of edits only needs the newest commit deployed. Cancelling an
# in-flight build is safe because it builds into its own release directory
# and never touches the one being served.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  RELEASES: /srv/igem-wiki/releases
  CURRENT: /srv/igem-wiki/current
  KEEP_RELEASES: 3

jobs:
  deploy:
    runs-on: [self-hosted, staging]
    steps:
      - uses: actions/checkout@v4

      # The runner workspace is never served. Each deploy gets a fresh
      # release directory, so `npm ci` and `next build` can't pull files out
      # from under the running server (the old in-place deploy did, which is
      # why the site was broken for the duration of every build).
      - name: Stage release directory
        run: |
          mkdir -p "$RELEASES/$GITHUB_SHA"
          git archive HEAD | tar -x -C "$RELEASES/$GITHUB_SHA"

      - name: Install dependencies
        working-directory: ${{ env.RELEASES }}/${{ github.sha }}
        run: npm ci

      # Keystatic's GitHub-mode client ID/secret are needed at build time
      # (NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG is client-exposed, so it must
      # be baked in before build, not just present when the app starts).
      # /srv/igem-wiki/.env.staging is systemd's EnvironmentFile for the
      # running app, but that's not read during this CI build step, so
      # source it explicitly here instead.
      - name: Build (staging)
        working-directory: ${{ env.RELEASES }}/${{ github.sha }}
        run: |
          set -a
          source /srv/igem-wiki/.env.staging
          set +a
          npm run build:staging

      # Only reached after a successful build: swap the symlink atomically,
      # then restart so the server picks up the new release.
      - name: Activate release
        run: |
          ln -sfn "$RELEASES/$GITHUB_SHA" "$CURRENT.tmp"
          mv -Tf "$CURRENT.tmp" "$CURRENT"
          sudo systemctl restart igem-wiki

      - name: Prune old releases
        run: |
          cd "$RELEASES"
          live="$(basename "$(readlink -f "$CURRENT")")"
          ls -1t | grep -vx "$live" | tail -n +$((KEEP_RELEASES)) | xargs -r rm -rf

      # A failed or cancelled build leaves a half-built directory that is
      # not the live release; remove it.
      - name: Clean up unfinished release
        if: failure() || cancelled()
        run: |
          if [ "$(readlink -f "$CURRENT")" != "$RELEASES/$GITHUB_SHA" ]; then
            rm -rf "$RELEASES/$GITHUB_SHA"
          fi
